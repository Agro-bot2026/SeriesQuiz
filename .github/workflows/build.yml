name: Build SeriesQuiz APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SeriesQuiz-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

    - name: Build signed release APK + AAB
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease bundleRelease --no-daemon

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: SeriesQuiz-release-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload release AAB
      uses: actions/upload-artifact@v4
      with:
        name: SeriesQuiz-release-AAB
        path: app/build/outputs/bundle/release/*.aab
